name: Rent Truth BD - Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Production APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Force Clean Corrupted Caches
      run: |
        rm -rf ~/.gradle/caches
        rm -rf ~/.gradle/kotlin
        rm -rf app/build
        rm -rf .gradle

    - name: Rebuild Debug Keystore from Base64
      run: |
        if [ -f "debug.keystore.base64" ]; then
          base64 -d debug.keystore.base64 > debug.keystore
          echo "debug.keystore successfully restored from base64"
        else
          echo "debug.keystore.base64 not found, skipping restore"
        fi

    - name: Run Unit & Quality Assertion Tests
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      run: gradle clean testDebugUnitTest --stacktrace --info --no-daemon

    - name: Assemble Production Release APK
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      run: gradle assembleRelease --stacktrace --info --no-daemon

    - name: Upload Production Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Rent-Truth-BD-Production-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
