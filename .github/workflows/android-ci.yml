name: Rent Truth BD - Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Production APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Unit & Quality Assertion Tests
      run: gradle testDebugUnitTest --continue

    - name: Assemble Production Release APK
      run: gradle assembleRelease --stacktrace

    - name: Upload Production Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Rent-Truth-BD-Production-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
