name: Rent Truth BD - Production CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build & Test Production APK
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'
        cache: 'gradle'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Run Unit & Quality Assertion Tests
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      run: gradle clean testDebugUnitTest --stacktrace --info --no-daemon

    - name: Assemble Production Release APK
      env:
        JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"
      run: gradle assembleRelease --stacktrace --info --no-daemon

    - name: Upload Production Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Rent-Truth-BD-Production-Release-APK
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: warn
