version: '3.8'

services:
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: renttruth-api-server
    restart: always
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://renttruth_user:renttruth_secure_pass@db:5432/renttruth_db?sslmode=disable
      - REDIS_URL=redis://cache:6379
      - JWT_ACCESS_SECRET=renttruth_access_secret_token_key_2026_bd
      - JWT_REFRESH_SECRET=renttruth_refresh_secret_token_key_2026_bd
      - BKASH_APP_KEY=bkash_mock_app_key
      - BKASH_APP_SECRET=bkash_mock_app_secret
      - NAGAD_MERCHANT_ID=nagad_mock_merchant_id
    depends_on:
      - db
      - cache

  db:
    image: postgres:15-alpine
    container_name: renttruth-postgres-db
    restart: always
    environment:
      - POSTGRES_USER=renttruth_user
      - POSTGRES_PASSWORD=renttruth_secure_pass
      - POSTGRES_DB=renttruth_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    container_name: renttruth-redis-cache
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  nginx:
    image: nginx:alpine
    container_name: renttruth-nginx-proxy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - server

volumes:
  pgdata:
  redisdata:
